name: Build libchdr

on:
  workflow_call:

jobs:
  build-libchdr:
    strategy:
      matrix:
        arch:
          - name: x86_64
            goname: amd64
          - name: aarch64
            goname: arm64
        os:
          - name: linux
            cmakename: Linux
            goname: linux
            libc: gnu
        include:
          # arm support with soft-float, should not affect performance (libchdr doesn't use float/double)
          # but bring better portability for old arm-based NAS hardware
          - arch:
              name: arm
              goname: arm
            os:
              name: linux
              cmakename: Linux
              goname: linux
              libc: gnueabi.2.10
    name: Build libchdr on ${{ matrix.os.name }}/${{ matrix.arch.name }}
    runs-on: ubuntu-latest
    env:
      ZIGCC_FLAGS: '--target=${{ matrix.arch.name }}-${{ matrix.os.name }}-${{ matrix.os.libc }}'
    steps:
      - name: "Checkout libchdr"
        uses: actions/checkout@v7
        with:
          repository: rtissera/libchdr
          ref: v0.3.0
      - name: Setup Zig compliler
        uses: mlugg/setup-zig@v2
      - name: Install 'zigcc'
        run: pip install -U zigcc
      - name: Complile libchdr
        uses: threeal/cmake-action@v2.1.0
        with:
          build-dir: build
          c-compiler: zigcc
          options: |
            CMAKE_ASM_COMPILER='zigcc'
            CMAKE_SYSTEM_NAME=${{ matrix.os.cmakename }}
            CMAKE_BUILD_TYPE=Release
            CMAKE_SYSTEM_PROCESSOR=${{ matrix.arch.name }}
          build-args: |
            --target chdr
      - name: Install complied libs
        # 'tar' to preserve symlinks for versioned .so files
        run: |
          export BUILDDIR="${{ github.workspace }}/build"
          export DISTDIR="${{ github.workspace }}/dist"
          export STAGEDIR="$DISTDIR/stage"
          mkdir -p "$STAGEDIR"
          cmake --install "$BUILDDIR" --prefix "$DISTDIR" --strip
          find "$DISTDIR/lib" -name 'libchdr.so*' \
            \( -type f -o -type l \) -exec cp -P {} "$STAGEDIR/" \;
          (cd "$STAGEDIR" && tar -cf "$DISTDIR/libchdr.tar" libchdr.*)
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libchdr-${{ matrix.os.goname }}-${{ matrix.arch.goname }}
          path: ${{ github.workspace }}/dist/libchdr.tar
